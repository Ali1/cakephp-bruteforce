name: Dependency security evidence collection
run-name: dependency-security:${{ github.sha }}
'on':
  schedule:
    - cron: '19 1 * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: dependency-security-${{ github.ref }}
  cancel-in-progress: false
jobs:
  select:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.select.outputs.run_full }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - id: select
        env:
          GH_TOKEN: ${{ github.token }}
          NIGHTLY_ANCHOR_JOBS: Collect dependency security evidence
          CHECK_TITLE_PREFIX: dependency-security
        run: node .github/scripts/nightly-candidate.cjs
  dependency-security:
    name: Collect dependency security evidence
    needs: select
    if: needs.select.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Read security tooling from the exact default source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Verify dedicated security evidence reporting tools
        run: node --test .github/scripts/dependency-security.test.cjs .github/scripts/dependency-audit-collection.test.cjs
      - name: Confirm exact default-history audit source
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH"
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_sqlite, pdo_mysql
          tools: composer
          coverage: none
      - name: Resolve audit graph without executing application or package code
        run: composer update --no-install --no-scripts --no-plugins --no-interaction --no-progress --prefer-dist --no-audit
      - name: Retain exact audit graph provenance
        run: |
          mkdir -p output/dependency-security
          cp composer.lock output/dependency-security/composer.lock
          node -e 'require("node:fs").writeFileSync("output/dependency-security/source.json",JSON.stringify({source_sha:process.env.GITHUB_SHA,graph:"independently resolved without installation, scripts or plugins",run_id:process.env.GITHUB_RUN_ID},null,2))'
      - name: Collect independent unsuppressed dependency security evidence
        run: node .github/scripts/dependency-security.cjs --collect-evidence
      - name: Retain security evidence even when audits fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-security-${{ github.sha }}
          path: output/dependency-security/
          if-no-files-found: warn
          retention-days: 30

name: Nightly static and unit checks
run-name: core-checks:${{ github.sha }}
'on':
  schedule:
    - cron: '19 1 * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: core-checks-${{ github.ref }}
  cancel-in-progress: false
jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.select.outputs.run_full }}
    steps:
      - uses: actions/checkout@v7
      - id: select
        env:
          GH_TOKEN: ${{ github.token }}
          NIGHTLY_ANCHOR_JOBS: 'Core checks'
          CHECK_TITLE_PREFIX: core-checks
        run: node .github/scripts/nightly-candidate.cjs
  checks:
    name: Core checks
    needs: select
    if: needs.select.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - name: Require exact default source
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          test "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_sqlite, pdo_mysql
          coverage: none
      - run: composer install --no-interaction --no-progress --prefer-dist
      - name: Retain exact resolved dependency graph for separate audit
        uses: actions/upload-artifact@v4
        with:
          name: dependency-security-lock-${{ github.sha }}
          path: composer.lock
          if-no-files-found: error
          retention-days: 7
      - name: Identify PHPStan cache runtime
        id: phpstan_cache_runtime
        shell: bash
        run: php -r '$extensions = []; foreach (get_loaded_extensions() as $extension) { $extensions[$extension] = phpversion($extension); } ksort($extensions); echo "id=" . hash("sha256", serialize([PHP_VERSION, PHP_OS_FAMILY, PHP_INT_SIZE, $extensions])) . PHP_EOL;' >> "$GITHUB_OUTPUT"
      - name: Restore PHPStan result cache
        id: phpstan_cache_restore
        uses: actions/cache/restore@v6
        with:
          path: .phpstan/resultCache.php
          key: phpstan-result-v1-${{ github.repository }}-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ steps.phpstan_cache_runtime.outputs.id }}-${{ hashFiles('composer.json', 'composer.lock', 'phpstan*.neon*', 'tests/phpstan*.neon*', 'stubs/**') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: phpstan-result-v1-${{ github.repository }}-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ steps.phpstan_cache_runtime.outputs.id }}-${{ hashFiles('composer.json', 'composer.lock', 'phpstan*.neon*', 'tests/phpstan*.neon*', 'stubs/**') }}-
      - run: vendor/bin/phpunit && composer phpstan
        id: phpstan_cache_analysis
      - name: Save PHPStan result cache
        uses: actions/cache/save@v6
        if: ${{ always() && !cancelled() && steps.phpstan_cache_restore.outcome == 'success' && steps.phpstan_cache_analysis.outcome != 'skipped' && hashFiles('.phpstan/resultCache.php') != '' }}
        with:
          path: .phpstan/resultCache.php
          key: ${{ steps.phpstan_cache_restore.outputs.cache-primary-key }}

  dependency-security:
    name: Dependency security audits
    needs: [select, checks]
    if: ${{ always() && !cancelled() && needs.select.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - name: Confirm actual audit source
        env:
          EXPECTED_SOURCE: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer
          coverage: none
      - name: Read graph produced by this exact source's dependency install
        uses: actions/download-artifact@v4
        with:
          name: dependency-security-lock-${{ github.sha }}
      - name: Verify security result reporting
        run: node --test .github/scripts/dependency-security.test.cjs
      - name: Run dependency security audits independently of functional checks
        run: node .github/scripts/dependency-security.cjs
      - name: Retain security evidence even when audits fail
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: dependency-security-${{ github.sha }}
          path: output/dependency-security/
          if-no-files-found: warn
          retention-days: 30

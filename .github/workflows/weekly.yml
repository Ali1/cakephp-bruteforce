name: Weekly standards
on:
  schedule:
    - cron: '45 5 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  standards:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.4']
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: composer cs-check

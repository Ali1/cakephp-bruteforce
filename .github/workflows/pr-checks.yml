name: PR checks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    name: Focused source preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
      - run: composer validate --no-check-publish
      - name: PHP syntax
        run: find src tests -name '*.php' -print0 | xargs -0 -n1 php -l

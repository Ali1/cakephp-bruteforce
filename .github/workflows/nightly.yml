name: Nightly tests
run-name: nightly-checks:${{ github.sha }}
on:
  schedule:
    - cron: '45 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: nightly-tests-${{ github.sha }}
  cancel-in-progress: false
jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.select.outputs.run_full }}
    steps:
      - uses: actions/checkout@v7
      - id: select
        env:
          GH_TOKEN: ${{ github.token }}
          NIGHTLY_ANCHOR_JOBS: 'Tests PHP 8.2|Tests PHP 8.4'
        run: node .github/scripts/nightly-candidate.cjs
  tests:
    needs: select
    if: needs.select.outputs.run == 'true'
    name: Tests PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.4']
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: composer test
      - run: composer phpstan
  standards:
    if: github.event_name == 'workflow_dispatch'
    name: Manual full standards
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.4']
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: composer cs-check
